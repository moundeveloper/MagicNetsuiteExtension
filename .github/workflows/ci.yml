name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vue-ui:
    name: Vue UI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: vue-ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: vue-ui
      - run: pnpm run check
        working-directory: vue-ui
      - run: pnpm test
        working-directory: vue-ui
      - run: pnpm run build
        working-directory: vue-ui
      - run: pnpm run check:bundle
        working-directory: vue-ui
      - run: pnpm audit --prod --audit-level high
        working-directory: vue-ui
      - name: Enforce custom single-choice controls
        shell: bash
        run: |
          if grep -RInE '<(select|option)([ >])' vue-ui/src extension-src; then
            echo "Use MSelect instead of native select/option controls."
            exit 1
          fi

  mcp-app:
    name: MCP app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: mcp_app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: mcp_app
      - run: pnpm run check
        working-directory: mcp_app
      - run: pnpm test
        working-directory: mcp_app
      - run: pnpm run build
        working-directory: mcp_app
      - run: pnpm audit --prod --audit-level high
        working-directory: mcp_app

  extension-and-native-tools:
    name: Extension and native tools
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp_server/package-lock.json
      - run: npm ci
        working-directory: mcp_server
      - run: npm run check
        working-directory: mcp_server
      - run: npm audit --omit=dev --audit-level=high
        working-directory: mcp_server
      - name: Check extension bridge syntax
        run: |
          node vue-ui/scripts/checkExtensionBuild.mjs
          node --check src/background.js
          node --check src/content/content_export.js
          node --check src/content/core/messaging/messageListener.js
          node --check src/netsuiteApi/netsuiteApi.js
          node --check src/netsuiteApi/sandboxCode.js
      - name: Test extension bridge security
        run: node --test extension-src/tests/*.test.mjs
      - name: Check SDF companion syntax
        run: |
          node --check sdf_tool/src/cli.js
